<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сторінку не знайдено — Beauty Glow</title>
    <link rel="stylesheet" href="css/koshyk.css" />
    <style>
      .error-container {
        text-align: center;
        padding: 80px 20px;
        max-width: 600px;
        margin: 0 auto;
      }
      .error-code {
        font-size: 80px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
      }
      .error-title {
        font-size: 24px;
        margin-bottom: 15px;
      }
      .error-desc {
        color: #666;
        margin-bottom: 30px;
      }
      .btn-home {
        display: inline-block;
        padding: 12px 24px;
        background-color: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        transition: background-color 0.2s;
      }
      .btn-home:hover {
        background-color: #555;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <a href="index.html" class="header-logo" aria-label="Beauty Glow — на головну">
          <img src="logo.png" alt="Beauty Glow" width="160" height="40" />
        </a>
      </div>
    </header>

    <main class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">Здається, цієї сторінки не існує</h1>
      <p class="error-desc">
        Можливо, ви ввели неправильну адресу або сторінка була переміщена.
      </p>
      <a href="index.html" class="btn-home">Повернутися на головну</a>
    </main>

    <footer class="site-footer">
      <p class="copyright">© 2026 Beauty Glow</p>
    </footer>
  </body>
</html>
